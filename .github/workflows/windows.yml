# Builds Lynda's Rummi Time for Windows (Intel/AMD and ARM) with scripts/build-win.sh,
# for the Mac with scripts/build-mac.sh and for Android with scripts/build-android.sh,
# and keeps the files as a download on the run's page.
#
# It also publishes them as a GitHub Release, which gives a permanent download address
# (https://github.com/truevy/myrummikub/releases/latest always points at the newest):
#   - merging a change to "version" in package.json, to this file, or to the build and
#     publish scripts into main
#     publishes v<version> if that version has no release yet (once, never twice);
#   - pushing a tag like v3.0.2 publishes that tag;
#   - Run workflow (Actions tab) with "tag" filled in publishes that tag, and with
#     "tag" empty only keeps the zips here for 30 days.
# The tag has to match "version" in package.json.
#
# The apps are not code-signed, so Windows shows "Windows protected your PC" the
# first time: choose More info, then Run anyway (see docs/signing.md).
name: Windows build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Publish to the release with this tag, for example v3.0.2 (leave empty to only keep the zips here)"
        required: false
        default: ""
  push:
    tags: ["v*"]
    branches: [main]
    paths:
      - package.json
      - .github/workflows/windows.yml
      - scripts/build-win.sh
      - scripts/build-mac.sh
      - scripts/build-android.sh
      - android/**
      - scripts/publish-windows-release.sh
      - scripts/windows-release-plan.sh

permissions:
  contents: write # to create the release and attach the zips

jobs:
  build:
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      build: ${{ steps.plan.outputs.build }}
    # macOS has the tools the script uses to draw the app icon from build/icon.svg
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Decide what to do
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: scripts/windows-release-plan.sh | tee -a "$GITHUB_OUTPUT"

      - name: Build the Windows apps
        if: steps.plan.outputs.build == 'true'
        run: scripts/build-win.sh

      - name: Build the Mac app
        if: steps.plan.outputs.build == 'true'
        env:
          SKIP_TESTS: "1" # the Windows build just ran them
        run: scripts/build-mac.sh

      - name: Keep the files
        if: steps.plan.outputs.build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: rummi-time-desktop
          path: |
            dist/*.zip
            dist/*.dmg
          retention-days: 30
          if-no-files-found: error

      - name: Publish to the release
        if: steps.plan.outputs.build == 'true' && steps.plan.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/publish-windows-release.sh "${{ steps.plan.outputs.tag }}"

  # The Android app is built on a Linux machine, where the Android SDK is installed. It
  # goes into the same release once the Windows and Mac files have created it.
  android:
    needs: build
    if: needs.build.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      # Push notifications need the app's file from the Firebase console, kept as a secret
      # (docs/android.md). Without it the app is built without them.
      - name: Add the Firebase file
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [[ -n "$GOOGLE_SERVICES_JSON" ]]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          else
            echo "No GOOGLE_SERVICES_JSON secret: building without push notifications." >&2
          fi

      - name: Build the Android app
        env:
          SKIP_TESTS: "1" # the Windows build runs them
        run: scripts/build-android.sh

      - name: Keep the file
        uses: actions/upload-artifact@v4
        with:
          name: rummi-time-android
          path: dist/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Publish to the release
        if: needs.build.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
        run: gh release upload "$TAG" dist/*.apk --clobber
