<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' blob: mediastream:; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com https://*.firebasedatabase.app wss://*.firebasedatabase.app">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Lynda's Rummi Time</title>
  <link rel="stylesheet" href="src/styles.css">
</head>
<body>
  <div id="app">
    <header id="topbar">
      <div class="brand"><em>Lynda's</em><span>R</span><span>u</span><span>m</span><span>m</span><span>i</span><i></i><span>T</span><span>i</span><span>m</span><span>e</span></div>
      <div id="players"></div>
      <div id="pool" title="Tiles left in the pool">
        <div class="pool-stack"><i></i><i></i><i></i></div>
        <div class="pool-info"><b id="pool-count">0</b><small>in pool</small></div>
      </div>
      <button id="btn-more" class="tool" title="Menu">☰</button>
      <div id="tools">
        <button id="btn-log" class="tool compact-only" title="Show the move log">📜<span> Move log</span></button>
        <button id="btn-chat" class="tool compact-only" title="Show the chat">💬<span> Chat</span></button>
        <button id="btn-games" class="tool" title="Your games" hidden>🎲<span> Games</span><b id="games-count"></b></button>
        <button id="btn-switch" class="tool" title="Switch to your other game" hidden></button>
        <button id="btn-pause" class="tool" title="Pause / resume">⏸</button>
        <div class="speed" title="AI speed">
          <button class="tool" data-speed="1.7">Slow</button>
          <button class="tool on" data-speed="1">Normal</button>
          <button class="tool" data-speed="0.35">Fast</button>
        </div>
        <button id="btn-sound" class="tool" title="Mute / unmute">🔊</button>
        <button id="btn-settings" class="tool" title="Sounds, volume and move assist">⚙<span> Settings</span></button>
        <button id="btn-online" class="tool" title="Friends online and invitations">🌐<span> Online</span><b id="online-count"></b></button>
        <button id="btn-save" class="tool" title="Save this game to a file (⌘S)">💾<span> Save</span></button>
        <button id="btn-load" class="tool" title="Load a saved game (⌘O)">📂<span> Load</span></button>
        <button id="btn-menu" class="tool" title="Start a new game">New game</button>
      </div>
    </header>

    <div id="body">
      <aside id="log" class="closed">
        <div class="log-head">
          <b>Move log</b>
          <button id="log-toggle" class="tool" title="Show or hide the move log">›</button>
        </div>
        <div id="log-list"></div>
        <button id="log-live" class="btn primary">▶ Back to the game</button>
      </aside>
      <div id="stage">
    <main id="table-wrap">
      <div id="board"></div>
    </main>
    <div id="turn-alert" hidden><span id="turn-alert-text"></span><button class="btn primary" id="turn-alert-open">Open</button><button class="tool" id="turn-alert-close">✕</button></div>
    <div id="zoom"><button id="zoom-out" class="tool" title="Zoom out">−</button><button id="zoom-in" class="tool" title="Zoom in on the table">+</button></div>

    <footer id="bottom">
      <div id="status"><span id="status-game"></span><span id="assist"></span><span id="status-text"></span><span id="meld-meter"></span><button id="btn-skip" class="btn ghost" hidden>⏭ Skip their turn</button></div>
      <div id="rack-row">
        <div class="side left">
          <button id="btn-sort-runs" class="btn ghost" title="Sort by colour, then number">Sort <b>1·2·3</b></button>
          <button id="btn-sort-groups" class="btn ghost" title="Sort by number, then colour">Sort <b>7·7·7</b></button>
          <button id="btn-hint" class="btn ghost hint-btn" title="Show the best move from the start of your turn">💡 Hint</button>
        </div>
        <div id="rack"><div id="rack-label"></div></div>
        <div class="side right">
          <div class="pair">
            <button id="btn-undo" class="btn ghost" title="Take back the last tile you put down">↶<span> Undo tile</span></button>
            <button id="btn-reset" class="btn ghost" title="Take back everything you did this turn">↺<span> Take back</span></button>
          </div>
          <button id="btn-draw" class="btn">Draw tile</button>
          <button id="btn-end" class="btn primary">End turn ✓</button>
        </div>
      </div>
    </footer>
      </div>
      <aside id="chat" hidden>
        <div class="log-head"><button id="chat-toggle" class="tool" title="Show or hide the chat">›</button><b>Chat</b><i id="chat-unread"></i></div>
        <div id="chat-list"></div>
        <form id="chat-form"><input id="chat-input" maxlength="300" placeholder="Say something…" autocomplete="off"><button class="tool" id="chat-send" title="Send">➤</button></form>
      </aside>
    </div>
  </div>

  <div id="tiles"></div>
  <div id="movebox"></div>
  <div id="bigtext"></div>
  <div id="hintbox"></div>
  <div id="toast"></div>
  <div id="overlay"></div>

  <script src="vendor/firebase/firebase-app-compat.js"></script>
  <script src="vendor/firebase/firebase-auth-compat.js"></script>
  <script src="vendor/firebase/firebase-database-compat.js"></script>
  <script src="src/config.js"></script>
  <script src="src/engine.js"></script>
  <script src="src/ai.js"></script>
  <script src="src/game.js"></script>
  <script src="src/profiles.js"></script>
  <script src="src/lobby.js"></script>
  <script src="src/sync.js"></script>
  <script src="src/cloud.js"></script>
  <script src="src/ui.js"></script>
</body>
</html>
