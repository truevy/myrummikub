<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lynda's Rummi Time — sign in</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; background: #1b1f2a; color: #f4f1e6; text-align: center; }
  .card { padding: 28px 32px; border-radius: 20px; background: #ffffff14; border: 1px solid #ffffff2a; max-width: 420px; }
  h1 { margin: 0 0 6px; font-size: 22px; }
  p { margin: 8px 0; line-height: 1.5; opacity: .9; }
  a.btn { display: inline-block; margin-top: 14px; padding: 12px 22px; border-radius: 12px; background: #ffd166; color: #3a2a00; font-weight: 800; text-decoration: none; }
  .err { color: #ff8fa3; }
</style>
</head>
<body>
<div class="card">
  <h1>Lynda's Rummi Time</h1>
  <p id="msg">Signing you in…</p>
</div>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script>
// This page runs the Apple or Google sign-in that the game itself cannot
// (a desktop app, or Google on the phone), and hands the result back to the
// app through its link scheme. Nothing is stored here.
(function () {
  var config = {
    apiKey: 'AIzaSyCm8bI4i7Z7Q25rB575idBojaD44Ku7Jko',
    authDomain: 'lyndas-rummikub.firebaseapp.com',
    projectId: 'lyndas-rummikub',
    appId: '1:485486594044:web:f08a90bc68b31944d21479',
  };
  firebase.initializeApp(config);
  var auth = firebase.auth();
  auth.setPersistence(firebase.auth.Auth.Persistence.NONE);
  var params = new URLSearchParams(location.search);
  var provider = params.get('provider') === 'google' ? 'google' : 'apple';
  var back = 'rummi-tummi://auth';
  var msg = document.getElementById('msg');
  var fail = function (text) {
    msg.innerHTML = '<span class="err">' + text + '</span><br><a class="btn" href="' + back + '?error=' + encodeURIComponent(text) + '">Back to the game</a>';
  };
  try { sessionStorage.setItem('rk-provider', provider); } catch (e) {}
  auth.getRedirectResult().then(function (result) {
    if (!result || !result.user || !result.credential) {
      var p = provider === 'google' ? new firebase.auth.GoogleAuthProvider() : new firebase.auth.OAuthProvider('apple.com');
      if (provider === 'apple') p.addScope('name');
      return auth.signInWithRedirect(p);
    }
    var json = JSON.stringify(result.credential.toJSON());
    var name = (result.user.displayName || '').slice(0, 40);
    var url = back + '?provider=' + provider + '&c=' + encodeURIComponent(btoa(unescape(encodeURIComponent(json)))) + (name ? '&name=' + encodeURIComponent(name) : '');
    auth.signOut();
    msg.innerHTML = 'Signed in. Returning to the game…<br><a class="btn" href="' + url + '">Open Lynda\'s Rummi Time</a>';
    location.href = url;
  }).catch(function (err) {
    fail(err && err.message ? err.message : 'The sign-in did not complete.');
  });
})();
</script>
</body>
</html>
